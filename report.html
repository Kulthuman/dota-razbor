<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разбор поражения</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f4f5f8; --card: #ffffff; --line: #e1e4ec; --text: #171a22; --dim: #667085;
    --red: #e5484d; --amber: #f0a020; --green: #1f9d63; --blue: #2f6fed; --track: #e9ecf3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b202b; --line: #2b3242; --text: #e9edf5; --dim: #8b95a8;
      --red: #ff6369; --amber: #ffb84d; --green: #3ccf8e; --blue: #6ea8ff; --track: #2a3040;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 28px 0 10px; font-weight: 700; }
  .sub { color: var(--dim); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .hero { display: grid; grid-template-columns: 112px 1fr auto; gap: 14px; align-items: center; }
  .hero img { width: 112px; height: 63px; object-fit: cover; border-radius: 10px; background: var(--track); }
  .tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--red); }
  .name { font-size: 20px; font-weight: 700; word-break: break-word; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: var(--track); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .chip b { font-weight: 700; }
  .gauge { position: relative; width: 92px; height: 92px; }
  .gauge span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 800; }
  .verdict { margin-top: 12px; font-size: 14px; color: var(--dim); }
  .reason { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .reason:first-child { border-top: 0; padding-top: 0; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-top: 7px; }
  .reason b { display: block; }
  .reason span { color: var(--dim); font-size: 14px; }
  .bars { display: grid; gap: 10px; }
  .bar { display: grid; grid-template-columns: 120px 1fr 36px; gap: 10px; align-items: center; font-size: 13px; }
  .track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; }
  .bar .v { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .bar.na { opacity: .45; }
  svg.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; color: var(--dim); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .turn { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .turn b { display: block; }
  .row { display: grid; grid-template-columns: 44px 1fr 90px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row img { width: 44px; height: 25px; border-radius: 5px; object-fit: cover; background: var(--track); }
  .row .who { min-width: 0; }
  .row .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .who span { color: var(--dim); font-size: 12px; }
  .sc { display: grid; gap: 4px; justify-items: end; font-size: 13px; font-weight: 700; }
  .sc .track { width: 90px; height: 6px; }
  .more { display: none; padding: 0 0 12px 54px; font-size: 13px; color: var(--dim); }
  .more.open { display: block; }
  .more div { margin-top: 4px; }
  .win .sc { display: none; }
  .win .row { grid-template-columns: 44px 1fr auto; cursor: default; }
  .kda { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--dim); }
  .ev { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .ev:first-child { border-top: 0; }
  .ev time { font-variant-numeric: tabular-nums; color: var(--dim); }
  .ev.bad b { color: var(--red); }
  .two { display: grid; gap: 12px; }
  .note { margin-top: 24px; font-size: 12px; color: var(--dim); }
  .warn { background: color-mix(in srgb, var(--amber) 16%, transparent); border: 1px solid var(--amber); border-radius: 12px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
  .err { text-align: center; padding: 60px 20px; color: var(--dim); }
  @media (max-width: 520px) {
    .hero { grid-template-columns: 1fr auto; }
    .hero img { grid-column: 1 / -1; width: 100%; height: auto; aspect-ratio: 16/9; }
    .bar { grid-template-columns: 96px 1fr 32px; }
  }
</style>
</head>
<body>
<main id="app"><div class="err">Загружаю разбор…</div></main>
<script type="module">
import { getReport, requestParse } from './lib.js';
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  const fmt = (n) => Math.round(n || 0).toLocaleString('ru-RU');
  const time = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const NS = 'http://www.w3.org/2000/svg';

  // Все тексты добавляются через textContent — ники игроков не могут вставить в страницу чужую разметку.
  function el(tag, cls, text, kids) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    (kids || []).forEach((k) => k && n.appendChild(k));
    return n;
  }
  function svg(tag, attrs, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  const imgEl = (src) => { const i = el('img'); i.alt = ''; i.loading = 'lazy'; if (src) i.src = src; i.onerror = () => { i.style.visibility = 'hidden'; }; return i; };

  const label = (s) => s >= 60 ? 'решающая просадка' : s >= 45 ? 'серьёзная просадка' : s >= 30 ? 'заметная просадка' : s >= 15 ? 'небольшая просадка' : 'почти без просадки';
  const color = (s) => s >= 55 ? 'var(--red)' : s >= 30 ? 'var(--amber)' : 'var(--green)';

  const METRICS = [
    ['lane', 'Линия (10 мин)'], ['econ', 'Ресурсы'], ['dmg', 'Урон по героям'], ['tower', 'Здания'],
    ['deaths', 'Смерти'], ['kp', 'Участие в боях'], ['util', 'Поддержка'],
  ];

  function gauge(score) {
    const R = 40, C = 2 * Math.PI * R;
    const s = svg('svg', { viewBox: '0 0 100 100', width: 92, height: 92 });
    s.appendChild(svg('circle', { cx: 50, cy: 50, r: R, fill: 'none', stroke: 'var(--track)', 'stroke-width': 9 }));
    s.appendChild(svg('circle', { cx: 50, cy: 50, r: R, fill: 'none', stroke: color(score), 'stroke-width': 9, 'stroke-linecap': 'round',
      'stroke-dasharray': `${(C * score) / 100} ${C}`, transform: 'rotate(-90 50 50)' }));
    return el('div', 'gauge', null, [s, el('span', null, String(score))]);
  }

  function bars(comp) {
    const box = el('div', 'bars');
    METRICS.forEach(([k, name]) => {
      const v = comp ? comp[k] : null;
      const has = v != null;
      const fill = el('div', 'fill');
      fill.style.width = `${has ? Math.max(2, v) : 0}%`;
      fill.style.background = color(has ? v : 0);
      box.appendChild(el('div', 'bar' + (has ? '' : ' na'), null, [el('span', null, name), el('div', 'track', null, [fill]), el('span', 'v', has ? String(Math.round(v)) : '—')]));
    });
    return box;
  }

  function goldChart(r) {
    const adv = r.gold.series;
    if (adv.length < 2) return el('div', 'sub', 'Для этого матча нет минутных данных о золоте: OpenDota ещё не разобрал реплей.');
    const W = 720, H = 270, padX = 14, padT = 14, padB = 26;
    const max = Math.max(1000, ...adv.map(Math.abs)) * 1.1;
    const x = (m) => padX + (m * (W - 2 * padX)) / (adv.length - 1);
    const y = (v) => padT + ((max - v) / (2 * max)) * (H - padT - padB);
    const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': 'Разница по золоту' });

    const t = r.turning;
    if (t && t.fromMin != null) s.appendChild(svg('rect', { x: x(t.fromMin), y: padT, width: x(t.toMin) - x(t.fromMin), height: H - padT - padB, fill: 'var(--red)', opacity: 0.13 }));

    s.appendChild(svg('line', { x1: padX, x2: W - padX, y1: y(0), y2: y(0), stroke: 'var(--dim)', 'stroke-dasharray': '4 5', opacity: 0.6 }));
    for (let m = 0; m < adv.length; m += 10) s.appendChild(svg('text', { x: x(m), y: H - 6, fill: 'var(--dim)', 'font-size': 12, 'text-anchor': m === 0 ? 'start' : 'middle' }, `${m}′`));
    s.appendChild(svg('text', { x: padX + 2, y: padT + 10, fill: 'var(--dim)', 'font-size': 12 }, 'ваша команда впереди'));
    s.appendChild(svg('text', { x: padX + 2, y: H - padB - 6, fill: 'var(--dim)', 'font-size': 12 }, 'соперник впереди'));

    const pts = adv.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    s.appendChild(svg('polygon', { points: `${x(0)},${y(0)} ${pts.join(' ')} ${x(adv.length - 1)},${y(0)}`, fill: 'var(--blue)', opacity: 0.12 }));
    s.appendChild(svg('polyline', { points: pts.join(' '), fill: 'none', stroke: 'var(--blue)', 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

    r.gold.culpritDeaths.forEach((sec) => {
      const f = Math.min(adv.length - 1, Math.max(0, sec / 60)), i0 = Math.floor(f), i1 = Math.min(adv.length - 1, i0 + 1);
      const v = adv[i0] * (1 - (f - i0)) + adv[i1] * (f - i0);
      const c = svg('circle', { cx: x(f), cy: y(v), r: 6, fill: 'var(--red)', stroke: 'var(--card)', 'stroke-width': 2 });
      c.appendChild(svg('title', {}, `${r.culprit.name} погиб в ${time(sec)}`));
      s.appendChild(c);
    });

    // подсказка при наведении и касании
    const guide = svg('line', { y1: padT, y2: H - padB, stroke: 'var(--dim)', opacity: 0, 'stroke-width': 1 });
    const tipBg = svg('rect', { rx: 6, height: 24, fill: 'var(--text)', opacity: 0 });
    const tip = svg('text', { fill: 'var(--card)', 'font-size': 13, 'font-weight': 700, opacity: 0 });
    [guide, tipBg, tip].forEach((n) => s.appendChild(n));
    const show = (ev) => {
      const b = s.getBoundingClientRect();
      const m = Math.min(adv.length - 1, Math.max(0, Math.round((((ev.clientX - b.left) / b.width) * W - padX) / ((W - 2 * padX) / (adv.length - 1)))));
      const v = adv[m];
      const text = `${m}′  ${v >= 0 ? '+' : '−'}${fmt(Math.abs(v))}`;
      tip.textContent = text;
      const w = text.length * 8 + 16, tx = Math.min(W - w - 4, Math.max(4, x(m) - w / 2));
      guide.setAttribute('x1', x(m)); guide.setAttribute('x2', x(m)); guide.setAttribute('opacity', 0.6);
      tipBg.setAttribute('x', tx); tipBg.setAttribute('y', padT + 18); tipBg.setAttribute('width', w); tipBg.setAttribute('opacity', 0.9);
      tip.setAttribute('x', tx + 8); tip.setAttribute('y', padT + 35); tip.setAttribute('opacity', 1);
    };
    s.addEventListener('pointermove', show); s.addEventListener('pointerdown', show);

    const legend = el('div', 'legend', null, [
      el('span', null, null, [Object.assign(el('i'), { style: 'background:var(--blue)' }), document.createTextNode('разница по золоту')]),
      el('span', null, null, [Object.assign(el('i'), { style: 'background:var(--red)' }), document.createTextNode(`смерти: ${r.culprit.name}`)]),
      t && t.fromMin != null ? el('span', null, null, [Object.assign(el('i'), { style: 'background:var(--red);opacity:.4;border-radius:2px' }), document.createTextNode('потеря преимущества')]) : null,
    ]);
    const turn = el('div', 'turn', null, [el('b', null, `${t.title}${t.t !== '—' ? ' · ' + t.t : ''}`), el('span', 'sub', t.text)]);
    return el('div', null, null, [s, legend, turn]);
  }

  function loserRow(p, isCulprit) {
    const more = el('div', 'more', null, [
      ...(p.reasons.length ? p.reasons.slice(0, 3).map((x) => el('div', null, `• ${x.title}: ${x.text}`)) : [el('div', null, 'Явного провала нет.')]),
    ]);
    const fill = el('div', 'fill'); fill.style.width = `${Math.max(2, p.score)}%`; fill.style.background = color(p.score);
    const row = el('div', 'row', null, [
      imgEl(p.heroImg),
      el('div', 'who', null, [el('b', null, (isCulprit ? '🔻 ' : '') + p.name), el('span', null, `${p.hero} · ${p.role || ''}`), el('span', 'kda', `  ${p.kills}/${p.deaths}/${p.assists}`)]),
      el('div', 'sc', null, [el('span', null, String(p.score)), el('div', 'track', null, [fill])]),
    ]);
    row.addEventListener('click', () => more.classList.toggle('open'));
    return [row, more];
  }

  function render(r) {
    const c = r.culprit, app = document.getElementById('app');
    app.textContent = '';
    document.title = `Разбор матча ${r.matchId}`;

    const back = el('a', 'sub', '← К моим играм'); back.href = 'index.html'; back.style.display = 'inline-block'; back.style.marginBottom = '6px';
    app.appendChild(back);
    app.appendChild(el('h1', null, `Разбор поражения${r.demo ? ' · тестовый матч' : ''}`));
    app.appendChild(el('div', 'sub', `Матч ${r.matchId} · ${r.winner} победили ${r.score.win}:${r.score.lose} · ${time(r.duration)}`));
    if (!r.detail.parsed) {
      const ask = el('button', null, 'Запросить подробный разбор');
      ask.style.marginTop = '8px';
      const warn = el('div', 'warn', 'Подробных данных матча нет (реплей ещё не разобран или матч старый), поэтому оценка построена только по общей статистике. Можно попросить OpenDota разобрать реплей: обычно это занимает несколько минут.');
      ask.addEventListener('click', async () => {
        ask.disabled = true;
        try { await requestParse(r.matchId); ask.textContent = 'Запрос отправлен — открой страницу снова через 3–5 минут'; }
        catch (e) { ask.disabled = false; ask.textContent = 'Не получилось, попробуй позже'; }
      });
      warn.appendChild(document.createElement('br')); warn.appendChild(ask);
      app.appendChild(warn);
    }

    // слабое звено
    app.appendChild(el('h2', null, 'Слабое звено'));
    const chips = el('div', 'chips', null, [
      ['K/D/A', `${c.kills}/${c.deaths}/${c.assists}`], ['GPM', fmt(c.gpm)], ['Участие', `${c.kp.toFixed(0)}%`], ['Урон', fmt(c.heroDamage)], ['Здания', fmt(c.towerDamage)],
    ].map(([k, v]) => el('span', 'chip', null, [document.createTextNode(`${k} `), el('b', null, v)])));
    app.appendChild(el('div', 'card', null, [
      el('div', 'hero', null, [
        imgEl(c.heroImg),
        el('div', null, null, [el('div', 'tag', 'СЛАБОЕ ЗВЕНО'), el('div', 'name', c.name), el('div', 'sub', `${c.hero}${c.role ? ' · ' + c.role : ''}`)]),
        gauge(c.score),
      ]),
      chips,
      el('div', 'verdict', `Индекс просадки ${c.score}/100 — ${label(c.score)}. Надёжность оценки ${c.confidence}%.${c.rival ? ` Сравниваем с оппонентом по роли: ${c.rival}.` : ''}`),
    ]));

    // причины и профиль
    app.appendChild(el('h2', null, 'Почему именно он'));
    app.appendChild(el('div', 'card', null, c.reasons.length
      ? c.reasons.map((x) => el('div', 'reason', null, [el('i', 'dot'), el('div', null, null, [el('b', null, x.title), el('span', null, x.text)])]))
      : [el('div', 'sub', 'Явного провала нет: показатели близки к уровню оппонентов, поражение выглядит командным.')]));

    app.appendChild(el('h2', null, 'Профиль просадки (0 — всё хорошо, 100 — провал)'));
    app.appendChild(el('div', 'card', null, [bars(c.components)]));

    // золото
    app.appendChild(el('h2', null, 'Ход игры'));
    app.appendChild(el('div', 'card', null, [goldChart(r)]));

    // команда проигравших
    app.appendChild(el('h2', null, 'Проигравшая команда · нажми на игрока'));
    app.appendChild(el('div', 'card', null, r.losers.flatMap((p) => loserRow(p, p.name === c.name && p.hero === c.hero))));

    // таймлайн
    if (r.events.length) {
      app.appendChild(el('h2', null, `Таймлайн · ${c.name}`));
      app.appendChild(el('div', 'card', null, r.events.map((e) => el('div', 'ev' + (e.danger ? ' bad' : ''), null, [el('time', null, e.t), el('div', null, null, [el('b', null, e.title), el('div', 'sub', e.text)])]))));
    }

    // что исправить и смягчающие
    app.appendChild(el('h2', null, 'Выводы'));
    app.appendChild(el('div', 'two', null, [
      el('div', 'card', null, [el('b', null, `Что исправить${r.lesson.reason ? ': ' + r.lesson.reason.toLowerCase() : ''}`), el('div', 'sub', r.lesson.action)]),
      el('div', 'card', null, [el('b', null, `Смягчающее: ${r.mitigation.title}`), el('div', 'sub', r.mitigation.text)]),
    ]));

    // победители
    app.appendChild(el('h2', null, 'Победившая команда'));
    app.appendChild(el('div', 'card win', null, r.winners.flatMap((p) => {
      const row = el('div', 'row', null, [imgEl(p.heroImg), el('div', 'who', null, [el('b', null, p.name), el('span', null, `${p.hero} · ${p.role || ''}`)]), el('span', 'kda', `${p.kills}/${p.deaths}/${p.assists}`)]);
      return [row];
    })));

    app.appendChild(el('div', 'note', 'Это оценка по статистике матча, а не приговор: она не видит голосовой связи, решений команды и ситуаций вне данных OpenDota. Данные: OpenDota. Проект не связан с Valve.'));
  }

  const id = new URLSearchParams(location.search).get('match') || '';
  (/^(\d{6,12}|demo)$/.test(id) ? getReport(id) : Promise.reject(new Error('Не указан Match ID. Открой разбор из списка игр.')))
    .then(render)
    .catch((e) => {
      const app = document.getElementById('app');
      app.textContent = '';
      app.appendChild(el('div', 'err', `Не получилось загрузить разбор: ${e.message}`));
    });
})();
</script>
</body>
</html>
